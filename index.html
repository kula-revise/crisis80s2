<style>
  /* ============================================================
     KULA SOURCE ENGINE v3: TOKEN CONTRACT
     This file is fixed mechanism. Do not edit it per series.
     A skin sets the THIRTEEN identity variables in the block below
     and nothing else is required of it.

     Two accents, split by job:
       --a1  accent one: navigation, progress, emphasis, option letters,
             the primary button, the story date. The "structure" accent.
       --a2  accent two: anything the learner earned. Correct answers,
             the running summary, breakdown bars, key facts, the last
             story line. The "reward" accent.
     Set --a1-rgb / --a2-rgb to the SAME colours as r,g,b (no #), because
     the tints, washes and shadows are built from them.
     ============================================================ */

  :root {
    /* ---- THE IDENTITY CONTRACT. A skin overrides these thirteen. ---- */
    --sand:  #F2E9D9;   /* page background */
    --paper: #FBF6EB;   /* cards */
    --cut:   #FFFCF4;   /* insets, sources, carousels */
    --ink:   #1B2A33;   /* body text */
    --clay:  #8C4A2F;   /* stage tags, quiet labels */
    --fade:  #7B7263;   /* muted text, captions */
    --a1: #B4622D;   --a1-rgb: 180,98,45;
    --a2: #1F6B58;   --a2-rgb: 31,107,88;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace;

    /* ---- DERIVED TOKENS. A skin should not need to touch these. ----
       They exist because the engine used to hardcode fourteen literal
       colours, which is what made every glossary definition and every
       source expander invisible in dark mode. Everything below now
       tracks the identity variables above, so a skin that sets --fade
       and --ink correctly gets a readable dark mode for free. ---- */
    --muted:      var(--fade);          /* secondary body text: kt-def, toggle-body, disc-body, cover-line */
    --hair:       rgba(0,0,0,0.12);     /* progress track, quiet rules */
    --hair-strong:rgba(0,0,0,0.28);     /* dashed divider inside an expander */
    --on-ink:     var(--paper);         /* text sitting on an --ink ground */
    --on-a1:      var(--paper);         /* text sitting on an --a1 ground */
    --on-a2:      var(--paper);         /* text sitting on an --a2 ground */
    --ink-deep:   #12202a;              /* --ink one step darker, button hover */
    --a2-deep:    #164C3F;              /* --a2 one step darker, button hover */
    --ok-bg:      rgba(var(--a2-rgb),0.13);  /* a correct option, a placed item */
    --no-bg:      rgba(140,74,47,0.13);      /* a wrong option, a misplaced item */
    /* Skill chips. a = the entry-level skill (Extract, Argue, Evidence, Recall).
       b = the middle skill (Interpret, Understand). c = unassessed instinct.
       The top skill (Evaluate, Weigh, Apply) sits on a solid accent ground. */
    --chip-a-bg: rgba(var(--a1-rgb),0.16);  --chip-a-fg: var(--a1);
    --chip-b-bg: rgba(var(--a2-rgb),0.16);  --chip-b-fg: var(--a2);
    --chip-c-bg: rgba(0,0,0,0.06);
    --scrim:  rgba(27,42,51,0.5);       /* modal backdrop */
    --inset:  rgba(255,255,255,0.4);    /* sort column well */

    /* Legacy aliases. Older skins and the quiz shell reference these. */
    --copper: var(--a1);
    --malachite: var(--a2);
  }

  /* ---- DARK MODE TOKEN RE-POINT ---------------------------------------
     The skin supplies body.dark values for the thirteen identity variables.
     Everything derived re-points here, once, for every unit. This is the
     engine-level fix for the three defects logged in MOBILE_FIXES_HANDOVER:
     a skin no longer needs the patch block at all.
     ------------------------------------------------------------------- */
  body.dark {
    --muted:      var(--fade);
    --hair:       rgba(255,255,255,0.14);
    --hair-strong:rgba(255,255,255,0.26);
    --on-ink:     var(--sand);
    --on-a1:      var(--sand);
    --on-a2:      var(--sand);
    --ink-deep:   var(--ink);
    --a2-deep:    var(--a2);
    --ok-bg:      rgba(var(--a2-rgb),0.20);
    --no-bg:      rgba(var(--a1-rgb),0.18);
    --chip-a-bg:  rgba(var(--a1-rgb),0.22);  --chip-a-fg: var(--ink);
    --chip-b-bg:  rgba(var(--a2-rgb),0.22);  --chip-b-fg: var(--ink);
    --chip-c-bg:  rgba(255,255,255,0.10);
    --scrim:  rgba(0,0,0,0.62);
    --inset:  rgba(255,255,255,0.05);
  }
  /* Key term chips keep a visible edge once the ground inverts. */
  body.dark .kt-term { border-color: var(--hair-strong); }
  body.dark .kt-term summary { color: var(--ink); }
  body.dark .kt-label { border-top-color: var(--hair-strong); }

  /* ---- MODE TOGGLE. Fixed bottom right, 44px minimum tap target. ---- */
  .mode-toggle {
    position: fixed; bottom: 0.9rem; right: 0.9rem; z-index: 40;
    display: flex; align-items: center; gap: 0.4rem;
    font-family: var(--sans); font-size: 0.66rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.62rem 0.75rem; min-height: 44px;
    background: var(--paper); color: var(--fade);
    border: 1px solid var(--hair-strong); cursor: pointer;
    box-shadow: 0 2px 12px var(--scrim);
  }
  .mode-toggle:hover { color: var(--ink); border-color: var(--a1); }
  .mode-toggle:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
  .mode-toggle svg { width: 0.9rem; height: 0.9rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
  @media (max-width: 520px) {
    .mode-toggle { min-height: 44px; padding: 0.62rem 0.7rem; font-size: 0.64rem; }
  }
  @media print { .mode-toggle { display: none; } }

  /* ---- STICKY HEADER AT 360px --------------------------------------
     .top-meta is a flex row and flex children default to min-width auto,
     so at 360px the eyebrow and the step counter used to overlap. The
     eyebrow now takes the free space and truncates rather than pushing
     the counter off. Renders correctly at 375px and above either way,
     which is why this was missed. 360 is common on mid-range Android.
     ----------------------------------------------------------------- */
  .top-meta { gap: 0.7rem; flex-wrap: nowrap; }
  .top-meta > * { min-width: 0; }
  .top-meta #lesson-tag, .top-meta .top-label {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top-meta .top-count { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 380px) {
    .top-meta { font-size: 0.62rem; letter-spacing: 0.09em; }
  }

/* THE CRISIS OF APARTHEID IN THE 1980s: drawing office

   Second attempt. The first one, plan and elevation, is kept as a teaser skin
   in skins/teaser/. It read well on its own and sat outside the family in a
   set, because it broke the five things the three built skins hold in common:

     1. the ground is ruled linearly at very low opacity, never dotted
     2. every card carries ONE accent stripe, never a stacked motif
     3. labels are filled or tracked, never outlined
     4. card and source edges stay intact, never clipped
     5. a sans display over a serif body, or a sans over a sans

   This version keeps the palette and the metaphor and rebuilds them inside
   that grammar. Distinct in look, familiar in construction, which is what the
   register actually asks for.

   Register check. Black Consciousness is the other strand of this same CAPS
   topic and holds Frank Talk: manila, typewriter mono on every label, no
   borders and no shadows. Nothing here goes near it. Black Power holds the
   placard press, which is why this identity stays off the poster route even
   though the decade is full of posters. Cold War rules at 45 degrees, Angola
   vertically, US Civil Rights horizontally. Congo holds Ore Seam's warm radial
   washes. Coming of Democracy holds dark navy with orange and green.

   The metaphor is still the one the topic supplies: a government redrawing its
   own plan into three chambers and local wards, and people drawing a second
   plan over the top of it, street by street.

   Signature moves, each absent from the register:
     - a crossed plan-paper rule, where the others rule in one direction only
     - the single card stripe broken into three segments, for the three chambers
     - sources framed twice, an outer rule and a hairline inner rule, like a
       drawing sitting inside its frame
     - aubergine and viridian, a pairing nothing else holds
*/

:root {
  --sand:  #E7E5DE;   /* page: drafting stone */
  --paper: #FAF9F5;   /* cards: the sheet */
  --cut:   #DFDDD4;   /* insets, sources, carousels */
  --ink:   #211F26;
  --clay:  #5E5A66;   /* stage tags, quiet labels */
  --fade:  #625E6D;
  /* aubergine for structure, viridian for anything the learner earned */
  --a1: #5B3A6E;  --a1-rgb: 91,58,110;
  --a2: #2C6B57;  --a2-rgb: 44,107,87;
  /* The two hover steps are derived, not identity. Left in the engine
     block they kept the engine's own accent and stopped tracking this
     skin the moment it set its own. */
  --ink-deep: #17161B;
  --a2-deep:  #1F4D3F;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace;
}

/* 1. Ground: plan paper. Linear like the rest of the family, but crossed,
      which none of the three built units do. */
body {
  font-family: var(--serif) !important;
  background-image:
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(33,31,38,0.030) 34px 35px),
    repeating-linear-gradient(0deg,  transparent 0 34px, rgba(33,31,38,0.030) 34px 35px) !important;
}
h1, h2, h3 {
  font-family: var(--sans) !important;
  font-weight: 600 !important;
  letter-spacing: -0.008em !important;
}

/* 2. Cards: square, hairline, one stripe at the head. The stripe is broken into
      three segments, which is the whole of the motif and the only place it
      appears on a card. */
.card, .source, .stat-wrap, .carousel, .kt {
  border-radius: 0 !important;
  border: 1px solid rgba(91,58,110,0.22) !important;
  box-shadow: none !important;
}
.card, .stat-wrap, .carousel {
  border-top: 3px solid transparent !important;
  background-color: var(--paper) !important;
  background-image:
    linear-gradient(90deg,
      var(--a1) 0 44%, transparent 44% 47%,
      var(--a1) 47% 78%, transparent 78% 81%,
      var(--a1) 81% 100%) !important;
  background-origin: border-box !important;
  background-clip: border-box !important;
  background-size: 100% 3px !important;
  background-position: 0 0 !important;
  background-repeat: no-repeat !important;
}

/* 3. Labels: filled aubergine plates, uppercase and tracked. Cold War fills in
      sentence case and Angola tracks in mono, so this sits between the two and
      matches neither. */
.stage-tag, .kt-label, .expl-label, .pop-label {
  font-family: var(--sans) !important;
  font-weight: 600 !important;
  font-size: 0.63rem !important;
  letter-spacing: 0.11em !important;
  text-transform: uppercase !important;
  background: var(--a1) !important;
  color: #F7F4F8 !important;
  border-radius: 0 !important;
  padding: 0.26rem 0.62rem !important;

}
.cover-eyebrow, .results-eyebrow, .top-meta {

}
.marks {

.source {

.toggle-btn {

/* 5. Cover flourish: the three chambers at full size, stepped. The engine's

.header-block::before, .cover-arc, .cover-fan { display: none !important; }
.rule, .cover-rule, .flourish, .story-rule {

  background-position: 0 0, 0 5px, 0 9px !important;
}

/* The engine reveals the three cover lines as inline spans on a stagger, which
   runs them together as one filling paragraph. Each span gets its own line so

@media (max-width: 520px) { .cover-line { min-height: 12rem; } }

.cover-title, .q-text, .story-line, .story-num { font-family: var(--sans) !important; }
.story-num { letter-spacing: -0.01em !important; }
.chip {
  border-radius: 0 !important;
  font-family: var(--sans) !important;

  letter-spacing: 0.06em !important;
}

/* 6. Buttons */
.btn-begin {
  background: var(--a1) !important;
  color: #F7F4F8 !important;

/* Figures. Caption reads left at a measure that holds on a phone. */
.figure figcaption {

.figure svg {

/* ---- DARK MODE ------------------------------------------------------------
   The same thirteen, and nothing else. engine/tokens.css re-points every
   derived token, so the old state-colour patch block is not carried here.
   --fade is chosen to measure above 7 to 1 against --paper, because it is what
   --muted inherits and --muted is every expander body. Measured against --cut,
   which is the ground it sits on inside an expander, not against --paper. That
   distinction was found on the TRC build and swept back here: the earlier
   figures were taken against --paper and both modes failed on --cut.

   The three built skins each carry a legacy state-colour patch block naming
   body.dark .option.correct, .explanation, the chips and every button. Checked
   against a shipped Angola file: it carries BOTH that patch block AND the
   engine's DARK MODE TOKEN RE-POINT, and the engine CSS reads --ok-bg, --no-bg,
   --chip-a-bg, --hair and --on-a2 rather than literals. So the patch block is
   redundant in those units and is correctly absent here. */
body.dark {
  --sand:  #17161B;
  --paper: #201E26;
  --cut:   #29272F;
  --ink:   #EAE7EE;
  --clay:  #A49EAE;
  --fade:  #B8B2C2;
  --a1: #B08BC7;  --a1-rgb: 176,139,199;
  --a2: #6BBD9C;  --a2-rgb: 107,189,156;
  /* On a dark ground a hover step goes lighter, not deeper. */
  --ink-deep: #FFFFFF;
  --a2-deep:  #8FD3B5;
}
body.dark {
  background-image:
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(234,231,238,0.038) 34px 35px),
    repeating-linear-gradient(0deg,  transparent 0 34px, rgba(234,231,238,0.038) 34px 35px) !important;
}
body.dark .card, body.dark .source, body.dark .stat-wrap,
body.dark .carousel, body.dark .kt { border-color: rgba(176,139,199,0.30) !important; }
body.dark .card, body.dark .stat-wrap, body.dark .carousel {
  background-color: var(--paper) !important;
  background-image:
    linear-gradient(90deg,
      var(--a1) 0 44%, transparent 44% 47%,
      var(--a1) 47% 78%, transparent 78% 81%,
      var(--a1) 81% 100%) !important;
  background-size: 100% 3px !important;
  background-position: 0 0 !important;
}
body.dark .source {
  box-shadow: inset 0 0 0 1px var(--cut), inset 0 0 0 2px rgba(176,139,199,0.34) !important;
}
body.dark .source-attr { border-bottom-color: rgba(176,139,199,0.36); }
body.dark .stage-tag, body.dark .kt-label,
body.dark .expl-label, body.dark .pop-label { color: #17161B !important; }
body.dark .btn-begin { color: #17161B !important; }
body.dark .btn-begin:hover { background: #C6A6D9 !important; border-color: #C6A6D9 !important; }
/* ---- The two engine rules the token re-point cannot rescue ----------------
   Correction to the note above. engine/tokens.css re-points every DERIVED token,
   so the legacy state-colour patch block is redundant for options, chips and
   explanations. It cannot help where the engine uses --ink or --sand directly
   as a BACKGROUND, because those two are meant to flip. Audited both engine
   stylesheets: exactly four rules do it. .option and .inter-item use --sand and
   stay correct, because they sit on --paper and the relationship holds either
   way round. .btn-begin is already overridden above. That leaves two, and both
   invert into a light slab on a dark page. Angola patches the same two. */
body.dark .primary-btn {
  background: var(--cut) !important;
  color: var(--ink) !important;
  border: 1px solid rgba(176,139,199,0.38) !important;
}
body.dark .primary-btn:hover { background: #2C2934 !important; }
body.dark .primary-btn .btn-title { color: var(--ink) !important; }
body.dark .primary-btn .btn-sub   { color: var(--fade) !important; }
body.dark .primary-btn .btn-num,
body.dark .primary-btn .btn-arrow { color: var(--a1) !important; }
body.dark .chip-apply {
  background: rgba(234,231,238,0.16) !important;
  color: var(--ink) !important;
}

/* Light serif at 0.95rem thins out on a dark ground. The explanation block is
   the longest reading on any screen, so it gets the full --ink value and a
   touch more size and leading rather than inheriting a muted tone. */
body.dark .expl-text, body.dark .disc-body { color: var(--ink) !important; }
body.dark .expl-text { font-size: 1rem !important; line-height: 1.75 !important; }

body.dark .figure img {
  border-color: rgba(176,139,199,0.4) !important;
  filter: brightness(0.9) contrast(1.02);
}
body.dark .figure svg { border-color: rgba(176,139,199,0.4) !important; }

/* The toggle is fixed bottom right and lands on Continue on a short viewport.

.mode-toggle {
  bottom: 1rem; right: 1rem;
  border-radius: 0 !important;
  font-family: var(--sans) !important;
  min-height: 44px;
  min-width: 44px;
}
body { padding-bottom: 4.5rem !important; }
@media (max-width: 520px) {
  .mode-toggle { bottom: 0.7rem; right: 0.7rem; padding: 0.5rem 0.7rem; font-size: 0.62rem; }
}
@media (max-width: 380px) {
  .top-meta { min-width: 0; }
  .source { padding: 1rem 0.95rem !important; }
}

  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(var(--a1-rgb),0.05) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse at top right, rgba(var(--a1-rgb),0.10) 0%, transparent 58%),
      radial-gradient(ellipse at bottom left, rgba(var(--a2-rgb),0.09) 0%, transparent 58%),
      var(--sand);
    padding: 1.6rem 1rem 3rem;
    font-family: var(--serif);

  }

  /* Flex children default to min-width auto, so at 360px the eyebrow and the

  .top-meta > * { min-width: 0; }
  .top-meta #lesson-tag, .top-meta .top-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-meta .top-count { flex: 0 0 auto; white-space: nowrap; }

  .track { height: 3px; background: var(--hair); overflow: hidden; }

  /* Cover */

<script>

    try{

};

  {

    "q": "Which number tells you more about the yard?",
    "options": [
      "The nine complaints, because somebody wrote each of them down",

    ],
    "correct": 2,
    "explanation": "Nothing is scored here. A count of complaints measures how well an office writes things down. A month without water measures what happened to you. Both are real. An office that reports only the first can be honest and still leave you with the wrong picture, because it never says what it left out. You are about to meet a table built by people who had to work out what could be counted at all."

    "type": "question",
    "kind": "instinct",
    "q": "If the office stopped logging complaints, what would its numbers show?",

    "correct": 1,
    "explanation": "A falling number can mean the problem got smaller. It can also mean the counting got smaller. You cannot tell which from the number on its own. That is the most useful thing to know about statistics. Later in this lesson the government limits what may be reported, and the counts get harder from then on."

    "type": "content",
    "tag": "The turn",
    "html": "<h2>The word for what you just did</h2><p>You did not ask whether the office was lying. You asked what its number was actually a count of, and what it therefore left out.</p><p>That is <strong>usefulness</strong>, and it is a different question from reliability. Reliability asks whether a source can be trusted. Usefulness asks what job it can do for you. A source can be one-sided and still be very useful, so long as you name the job.</p><p>Paper 2 asks it in those words. <em>Comment on the usefulness of the source to a historian researching this topic.</em> Naming the job is the whole answer.</p>",
    "remember": "Reliability asks can I trust it. Usefulness asks what can it do for me. A biased source can still be the best evidence of what somebody believed.",
    "terms": [
      {
        "term": "Usefulness",
        "def": "What a source lets a historian do. Judged against a named question, not in general, and not the same as whether it can be trusted."
      },
      {
        "term": "Limitation",
        "def": "What a source cannot tell you. It is about the silences in a source, not about its errors."
      }

her, and the protests spread across the country.</p><p>The rent boycott was aimed at the Community Councils, because rents were the money the councils lived on. Councillors were seen as the state's collectors and their houses became targets. Many resigned or fled. Some were killed, several by the method known as necklacing.</p><p>Once the councils stopped functioning, township administration stopped with them. Nobody was collecting refuse, hearing disputes or handling rents.</p>",

    "tag": "The evidence",
    "html": "<h2>People's power</h2><figure class=\"figure wide\"><svg role=\"img\" aria-label=\"A paired diagram. On the left, the state structure running from the Black Local Authorities Act of 1982 down through Community Councils and rent collection to a dashed box showing councillors resigning. On the right, the residents' structure running from the rent boycott up through street and area committees to people's power.\" viewBox=\"0 0 460 320\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"230\" y1=\"8\" x2=\"230\" y2=\"312\" stroke=\"var(--clay)\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"108\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--a1)\" font-weight=\"700\">What the state built</text><text x=\"352\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--a2)\" font-weight=\"700\">What residents built</text><rect x=\"6\" y=\"36\" width=\"204\" height=\"54\" fill=\"var(--cut)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/><text x=\"108\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Black Local Authorities Act</text><text x=\"108\" y=\"74\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">1982</text><path d=\"M108 90 L108 106 M102 100 L108 108 L114 100\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/><rect x=\"6\" y=\"108\" width=\"204\" height=\"54\" fill=\"var(--cut)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/><text x=\"108\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Community Council</text><text x=\"108\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">elected, few powers</text><path d=\"M108 162 L108 178 M102 172 L108 180 L114 172\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/><rect x=\"6\" y=\"180\" width=\"204\" height=\"54\" fill=\"var(--cut)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/><text x=\"108\" y=\"202\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Rent and service charges</text><text x=\"108\" y=\"218\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">collected from residents</text><rect x=\"6\" y=\"252\" width=\"204\" height=\"56\" fill=\"none\" stroke=\"var(--clay)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/><text x=\"108\" y=\"276\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"600\">Councillors resign or flee</text><text x=\"108\" y=\"293\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">Administration stops, 1984 to 1986</text><rect x=\"250\" y=\"36\" width=\"204\" height=\"54\" fill=\"var(--cut)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/><text x=\"352\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Rent boycott</text><text x=\"352\" y=\"74\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">money withheld</text><path d=\"M352 90 L352 106 M346 100 L352 108 L358 100\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/><rect x=\"250\" y=\"108\" width=\"204\" height=\"54\" fill=\"var(--cut)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/><text x=\"352\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Street committee</text><text x=\"352\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">elected, street by street</text><path d=\"M352 162 L352 178 M346 172 L352 180 L358 172\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/><rect x=\"250\" y=\"180\" width=\"204\" height=\"54\" fill=\"var(--cut)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/><text x=\"352\" y=\"202\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Area committee</text><text x=\"352\" y=\"218\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">and people's courts</text><rect x=\"250\" y=\"252\" width=\"204\" height=\"56\" fill=\"var(--cut)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/><text x=\"352\" y=\"276\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"700\">People's power</text><text x=\"352\" y=\"293\" font-size=\"10\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">a second plan over the first</text></svg><figcaption>The two systems of local government running in the same streets. The state's structure on the left, built by the Act of 1982 and broken by 1986. The residents' structure on the right, built from the rent boycott upwards. The dates matter because the second one grew into the space the first one left, rather than alongside it. Original illustration for Kula Revise.</figcaption></figure><p>Something had to replace the councils, and residents built it themselves. <strong>Civic organisations</strong>, usually called civics, set up street committees and area committees. People's courts heard disputes and handed down punishments.</p><p>This was called <strong>people's power</strong>, and it was a claim as much as a stopgap. The country was to be made ungovernable, and the structures that replaced the state were the proof that it could be governed differently.</p><p>They were argued about at the time and they still are. Supporters called the courts a real system of justice. Critics called them kangaroo courts, where a neighbour could be tried without safeguards and sometimes executed.</p>",
    "remember": "People's power grew where the state had withdrawn. That is what made it powerful and what made it dangerous.",
    "terms": [
      {
        "term": "Civic organisation",
        "def": "A community body organised around local issues such as rents, transport or services. Civics became the backbone of township resistance."
      },
      {
        "term": "People's power",
        "def": "The name for the street and area committees and people's courts that replaced collapsed township administration in the mid 1980s."
      },
      {
        "term": "Ungovernable",
        "def": "The stated aim of making normal administration impossible, so that the state had to negotiate rather than administer."
      }
    ]
  },

    "type": "source",
    "tag": "Source 3A",
    "sourceLabel": "Source 3A",
    "html": "<h2>The Security Council on the emergency, 26 July 1985</h2><p>Five days after the first state of emergency was declared.</p><p><strong>First pass:</strong> how many districts, and what does the Council want done?</p><p><strong>Second pass:</strong> the last paragraph lists measures. Notice which ones cost money and which cost pride.</p>",
    "source": {
      "attr": "Source 3A: from United Nations Security Council resolution 569 (1985), adopted at the 2602nd meeting on 26 July 1985 by thirteen votes to none, with two abstentions. A United Nations official record.",
      "body": "<p>Outraged at the repression, and condemning the arbitrary arrests of hundreds of persons,</p><p>Considering that the imposition of the state of emergency in 36 districts of the Republic of South Africa constitutes a grave deterioration [serious worsening] in the situation in that country,</p><p>Considering as totally unacceptable the use by the South African Government of detention without trial and forcible removal, as well as the discriminatory legislation in force,</p><p>3. Strongly condemns the establishment of the state of emergency in the 36 districts in which it has been imposed and demands that it be lifted immediately;</p><p>6. Urges States Members of the Organization to adopt measures against the Republic of South Africa, such as the following: (a) Suspension of all new investment in the Republic of South Africa; (b) Prohibition of the sale of krugerrands and all other coins minted in South Africa; (c) Restrictions in the field of sports and cultural relations.</p>",
      "toggle": "Two things to notice. Urges is a weaker word than demands, and the resolution uses both in the same document: it demands the emergency be lifted and only urges states to act. That difference is the whole story of sanctions in this period, because the Council could compel very little. And look at the list itself. New investment and krugerrands hit the economy; sport and culture hit how the country saw itself. The second kind was cheap to impose and, for many white South Africans, the one that stung. The vote is worth knowing too: thirteen to nothing, with the United Kingdom and the United States abstaining, which is exactly the split Lesson 4 turns on.",
      "toggleLabel": "What does this actually mean?"
    },
    "terms": [
      {
        "term": "State of emergency",
        "def": "A declaration suspending normal legal limits on the police and army. The first covered 36 magisterial districts from July 1985; a wider one followed in June 1986."
      },
      {
        "term": "Abstention",
        "def": "Choosing not to vote either way. Two permanent members abstained here rather than opposing, which lets a resolution pass without their support."
      },
      {
        "term": "Krugerrand",
        "def": "A South African gold coin sold worldwide. Banning it was a way of hitting gold earnings without a general trade ban."
      }
    ]
  },

    "q": "According to Source 3A, in how many districts had the state of emergency been imposed?",

    "explanation": "Thirty-six, and the resolution says it twice. Two marks, so give the number and say what it counts. The districts are the measure of how far the emergency reached. Option {opt1} is what happened later, in June 1986, when a second emergency covered the whole country. Keep the two apart in your answer: 1985 is the first, 1986 is the wider one."

  {
    "type": "question",
    "level": "Interpret",
    "marks": "(1 x 2)  2 marks",
    "q": "Explain why Source 3A demands that the emergency be lifted but only urges states to adopt measures.",
    "options": [
      "The Council could compel a government but not compel its own members",
      "The Council thought the measures listed would be ineffective anyway",
      "The measures had already been adopted by every member state",
      "The Council had been asked by South Africa to use weaker wording"
    ],
    "correct": 0,
    "explanation": "The two verbs mark two different kinds of power. A demand goes to the state whose behaviour is the problem. Sanctions are different, because each member state has to decide for itself, and two permanent members had just abstained. Option {opt1} treats the wording as a judgement about whether sanctions work. That is a reason you would be inventing."

    "html": "<h2>A table, and what it took to build</h2><p>The figures below were compiled by the South African Institute of Race Relations. They come from press reports, court records and inquest findings, and they count deaths in political violence.</p><table class=\"data\"><caption>Recorded deaths in political violence, 1984 to 1988. Compiled from the annual surveys of the South African Institute of Race Relations. Original table for Kula Revise: the figures are facts and the presentation is ours.</caption><thead><tr><th>Year</th><th>Recorded deaths</th></tr></thead><tbody><tr><td>1984</td><td>175</td></tr><tr><td>1985</td><td>879</td></tr><tr><td>1986</td><td>1 298</td></tr><tr><td>1987</td><td>661</td></tr><tr><td>1988</td><td>1 149</td></tr></tbody></table><figure class=\"figure wide\"><svg role=\"img\" aria-label=\"Bar chart of recorded deaths in political violence from 1984 to 1988, showing 175, then 879, then a peak of 1298 in 1986, a fall to 661 in 1987, and a second peak of 1149 in 1988.\" viewBox=\"0 0 460 300\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"6\" y=\"16\" font-size=\"11.5\" text-anchor=\"start\" fill=\"var(--clay)\" font-weight=\"400\">Recorded deaths in political violence</text><line x1=\"46\" y1=\"250.0\" x2=\"454\" y2=\"250.0\" stroke=\"var(--clay)\" stroke-width=\"0.7\" opacity=\"0.55\"/><text x=\"40\" y=\"254.0\" font-size=\"10\" text-anchor=\"end\" fill=\"var(--clay)\" font-weight=\"400\">0</text><line x1=\"46\" y1=\"147.8\" x2=\"454\" y2=\"147.8\" stroke=\"var(--clay)\" stroke-width=\"0.7\" opacity=\"0.55\"/><text x=\"40\" y=\"151.84283513097074\" font-size=\"10\" text-anchor=\"end\" fill=\"var(--clay)\" font-weight=\"400\">650</text><line x1=\"46\" y1=\"45.7\" x2=\"454\" y2=\"45.7\" stroke=\"var(--clay)\" stroke-width=\"0.7\" opacity=\"0.55\"/><text x=\"40\" y=\"49.68567026194145\" font-size=\"10\" text-anchor=\"end\" fill=\"var(--clay)\" font-weight=\"400\">1300</text><rect x=\"60\" y=\"222.5\" width=\"58\" height=\"27.5\" fill=\"var(--a1)\"/><text x=\"89\" y=\"214.49614791987673\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"700\">175</text><text x=\"89\" y=\"268\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">1984</text><rect x=\"140\" y=\"111.9\" width=\"58\" height=\"138.1\" fill=\"var(--a1)\"/><text x=\"169\" y=\"103.85208012326657\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"700\">879</text><text x=\"169\" y=\"268\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">1985</text><rect x=\"220\" y=\"46.0\" width=\"58\" height=\"204.0\" fill=\"var(--a1)\"/><text x=\"249\" y=\"38.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"700\">1 298</text><text x=\"249\" y=\"268\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">1986</text><rect x=\"300\" y=\"146.1\" width=\"58\" height=\"103.9\" fill=\"var(--a1)\"/><text x=\"329\" y=\"138.1140215716487\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"700\">661</text><text x=\"329\" y=\"268\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">1987</text><rect x=\"380\" y=\"69.4\" width=\"58\" height=\"180.6\" fill=\"var(--a1)\"/><text x=\"409\" y=\"61.417565485362104\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"700\">1 149</text><text x=\"409\" y=\"268\" font-size=\"12\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">1988</text><line x1=\"46\" y1=\"250\" x2=\"454\" y2=\"250\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/><text x=\"230\" y=\"290\" font-size=\"11\" text-anchor=\"middle\" fill=\"var(--clay)\" font-weight=\"400\">Two peaks, and almost none of the same kind of killing</text></svg><figcaption>The same figures as the table above, drawn so the shape shows. Two peaks, in 1986 and in 1988, with a deep dip between them. The years matter, because the two peaks are not the same event. Police account for 412 of the deaths in 1986. By 1988 the Natal conflict accounts for 912. Data from the annual surveys of the South African Institute of Race Relations. Original illustration for Kula Revise.</figcaption></figure><p>The 1986 total breaks down further. Police shot 412. Another 265 were killed by other black South Africans, 231 bodies were found burned, and 390 fall under other causes.</p><p>By 1988 the shape has changed completely. Only 34 were shot by police, while 912 died in the conflict in Natal between supporters of the front and of Inkatha.</p>",
    "remember": "1986 is the state's year and 1988 is not. The totals are similar and the cause of death is almost entirely different.",
    "terms": [
      {
        "term": "Inkatha",
        "def": "A mainly Zulu political organisation opposed to the ANC. Conflict between its supporters and the front dominated deaths in Natal by 1988."
      }
    ]
  },

    "level": "Interpret",
    "marks": "(2 x 2)  4 marks",
    "q": "The 1987 total falls sharply and then 1988 rises again. Explain what the two years together suggest.",
    "options": [
      "The violence did not stop, it moved from the state to other actors",

    "explanation": "Four marks means two developed points. The first is that the dip and the rise are not the same kind of violence. In 1986 most recorded deaths involve the police; by 1988 most are in the Natal conflict. The second is that a total hides that entirely. Option {opt3} is contradicted by the breakdown, because police killings fall from 412 to 34 in the table above you."

const CHIP = {
  Argue:{cls:"chip-argue"}, Evidence:{cls:"chip-evidence"}, Weigh:{cls:"chip-weigh"},
  Extract:{cls:"chip-extract"}, Interpret:{cls:"chip-interpret"}, Evaluate:{cls:"chip-evaluate"},
  instinct:{cls:"chip-instinct"}
};
// A lesson carries one spine or the other. Work it out on first use rather than at
// load time, so this never depends on FLOW having been evaluated yet.
const SOURCE_SPINE = ["Extract","Interpret","Evaluate"];
const ESSAY_SPINE  = ["Argue","Evidence","Weigh"];
let _spine = null;
function spine(){
  if(_spine) return _spine;
  const flow = (typeof FLOW !== "undefined" && Array.isArray(FLOW)) ? FLOW : [];
  _spine = flow.some(s => s && SOURCE_SPINE.includes(s.level)) ? SOURCE_SPINE : ESSAY_SPINE;
  return _spine;
}
// Never let an unknown label throw: an unrecognised spine word degrades to the neutral chip.
const chipCls = lvl => (CHIP[lvl] || CHIP.instinct).cls;

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
const topBar = document.getElementById("top-bar");
const nextBtn = document.getElementById("next-btn");
const backBtn = document.getElementById("back-btn");

const state = {
  idx: -1,                 // -1 = cover
  answers: {},             // qIdx -> chosen content index (mcq) or serialized (interactive)
  revealed: {},            // qIdx -> bool
  order: {},               // qIdx -> shuffled content-index array
  carRead: {},             // stepIdx -> Set of read card indices
  interState: {},          // qIdx -> working state for order/sort
};

const assessedIds = FLOW.map((f,i)=>(f.type==="question"&&f.level)?i:null).filter(i=>i!==null);

function esc(s){
  return String(s).replace(/[&<>"]/g, (c, i, str) => {
    if(c === "&"){
      // leave a real HTML entity intact (e.g. &middot; &amp; &#8635;)
      const rest = str.slice(i);
      if(/^&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/.test(rest)) return "&";
    }
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

// {optN} -> the letter option N carries after shuffle
function resolveOpts(text, order){
  if(!text) return text;
  return text.replace(/\{opt(\d+)\}/g,(m,n)=>{
    const p = order ? order.indexOf(parseInt(n,10)) : -1;
    return p>=0 ? String.fromCharCode(65+p) : m;
  });
}

// ============ COVER ============
function renderCover(){
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  const lines = (COVER.lines||[]).map(l=>`<span>${esc(l)} </span>`).join("");
  stage.innerHTML = `
    <div class="cover">
      <div class="cover-eyebrow">${COVER.eyebrow||""}</div>
      <h1 class="cover-title">${esc(COVER.title||"")}</h1>
      <div class="flourish"></div>
      <div class="cover-line" id="cover-line">${lines}</div>
      <button class="btn-begin" id="begin-btn">${COVER.begin||"Begin"} <span class="sa">&rarr;</span></button>
      ${COVER.time?`<div class="cover-time">${esc(COVER.time)}</div>`:""}
      ${COVER.skip!==false?`<button class="skip-link" id="skip-btn">Skip the opening if you have done this lesson before</button>`:""}
    </div>`;
  const spans = [...document.querySelectorAll("#cover-line span")];
  spans.forEach((s,i)=>setTimeout(()=>s.classList.add("vis"), 350*(i+1)));
  document.getElementById("begin-btn").addEventListener("click",()=>{ state.idx=0; render(); });
  const skip = document.getElementById("skip-btn");
  if(skip) skip.addEventListener("click",()=>{ state.idx = firstContentIdx(); render(); });
}
function firstContentIdx(){
  const i = FLOW.findIndex(f=>f.type==="content"||f.type==="carousel"||f.type==="stat");
  return i<0?0:i;
}

// ============ STORY HOOK ============
function renderStory(item){
  const lines = item.lines.map((l,i)=>{
    const last = i===item.lines.length-1 ? " last" : "";
    return `<div class="story-line${last}">${esc(l)}</div>`;
  }).join("");
  stage.innerHTML = `
    <div class="story">
      <div class="story-num">${esc(item.marker)}</div>
      <div class="story-unit">${esc(item.markerLabel||"")}</div>
      <div class="story-rule"></div>
      ${lines}
    </div>`;
  const els = [...stage.querySelectorAll(".story-line")];
  nextBtn.disabled = true;
  els.forEach((el,i)=>setTimeout(()=>{
    el.classList.add("vis");
    if(i===els.length-1) nextBtn.disabled = false;
  }, 650*(i+1)));
}

// ============ STATIC CONTENT ============
// Key-terms strip: label + one expandable chip per term.
function ktStrip(terms){
  if(!terms || !terms.length) return "";
  const chips = terms.map(t=>`<details class="kt-term"><summary>${esc(t.term)}</summary><div class="kt-def">${esc(t.def)}</div></details>`).join("");
  return `<div class="kt"><div class="kt-label">Key terms &middot; tap to open</div><div class="kt-row">${chips}</div></div>`;
}
function rememberBox(text){
  if(!text) return "";
  return `<details class="remember"><summary>Remember it like this</summary><div class="disc-body">${text}</div></details>`;
}

function renderContent(item){
  stage.innerHTML = `<div class="card">${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}${item.html}${rememberBox(item.remember)}${ktStrip(item.terms)}</div>`;
  bindToggles();
}

// ============ CAROUSEL ============
function renderCarousel(item){
  const cards = item.cards;
  if(!state.carRead[state.idx]) state.carRead[state.idx] = new Set([0]);
  const read = state.carRead[state.idx];
  const pos = state.interState[state.idx]?.pos || 0;
  read.add(pos);
  const c = cards[pos];
  const body = typeof c==="string" ? c : `<span class="cc-lead">${esc(c.lead)}</span>${esc(c.body)}`;
  const dots = cards.map((_,i)=>`<span class="car-dot ${read.has(i)?"read":""} ${i===pos?"here":""}"></span>`).join("");
  const allRead = read.size===cards.length;
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      <div class="car-wrap">
        <div class="car-prompt" id="car-prompt">${allRead?`That is all ${cards.length}. Continue is unlocked.`:`Tap the arrows to read all ${cards.length}. Continue unlocks when you have.`}</div>
        <div class="car-frame"><div class="car-card">${body}</div></div>
        <div class="car-nav">
          <div class="car-dots">${dots}</div>
          <div class="car-count">${pos+1} / ${cards.length}</div>
          <div class="car-btns">
            <button class="car-btn" id="car-prev" ${pos===0?"disabled":""}>&larr;</button>
            <button class="car-btn" id="car-next" ${pos===cards.length-1?"disabled":""}>&rarr;</button>
          </div>
        </div>
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  nextBtn.disabled = !allRead;
  const setPos=(p)=>{ state.interState[state.idx]={pos:p}; renderCarousel(item); };
  const pv=document.getElementById("car-prev"), nx=document.getElementById("car-next");
  if(pv) pv.addEventListener("click",()=>setPos(Math.max(0,pos-1)));
  if(nx) nx.addEventListener("click",()=>setPos(Math.min(cards.length-1,pos+1)));
}

// ============ STAT STRIP ============
function renderStat(item){
  const stats = item.stats.map(s=>`<div class="stat"><div class="stat-num">${esc(s.num)}</div><div class="stat-label">${esc(s.label)}</div></div>`).join("");
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      ${item.lead?`<p>${item.lead}</p>`:""}
      <div class="stat-strip">${stats}</div>
      ${ktStrip(item.terms)}
    </div>`;
}


// Reopen strip: shown on a question that follows a source, so the learner
// never has to tap Back to reread the extract.
//
// v2.1. Was: the strip offered LAST_SOURCE only. That is correct for a lesson
// built on one source and wrong for a capstone, where the paragraph question
// asks for all of them and a learner on the closing screens could reach only
// the most recent. Now every source seen so far in the file is reachable: a row
// of tabs, and a swipeable track underneath. One source renders exactly as
// before, so nothing in the existing corpus changes.
function sourcePeek(item){
  if(item.noSource) return "";
  if(item.sourceRef && item.sourceRef.body){
    return peekShell([item.sourceRef]);
  }
  const seen = SOURCES_SEEN.filter(s => s && s.body);
  if(!seen.length) return "";
  return peekShell(seen);
}

function peekShell(list){
  const many = list.length > 1;
  const cue = many
    ? `Tap to read the ${list.length} sources again`
    : `Tap to read ${esc(list[0].label)} again`;
  const who = many
    ? list.map(s=>esc(s.label)).join(" &middot; ")
    : esc(stripTags(list[0].attr)).slice(0,90);
  const tabs = many
    ? `<div class="peek-tabs" role="tablist">${list.map((s,i)=>
        `<button class="peek-tab${i===list.length-1?" on":""}" data-peek="${i}" role="tab">${esc(s.label)}</button>`).join("")}</div>`
    : "";
  const track = `<div class="peek-track" data-peek-track>${list.map(s=>
      `<div class="peek-slide"><div class="peek-attr">${s.attr}</div>${s.body}</div>`).join("")}</div>`;
  return `<details class="srcpeek${many?" multi":""}"><summary>
      <svg class="chev" width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><path d="M2 1.5 L8.5 6.5 L2 11.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="peek-cue">${cue}<span class="peek-who">${who}</span></span>
    </summary><div class="peek-body">${tabs}${track}</div></details>`;
}

// Tabs scroll the track; swiping the track updates the tabs. Both work alone,
// so a learner who never notices the tabs can still swipe, and the other way round.
function bindPeek(){
  stage.querySelectorAll(".srcpeek.multi").forEach(d=>{
    const track = d.querySelector("[data-peek-track]");
    const tabs  = Array.from(d.querySelectorAll(".peek-tab"));
    if(!track || !tabs.length) return;
    const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
    tabs.forEach(t => t.addEventListener("click", () => go(parseInt(t.dataset.peek,10))));
    let tick = null;
    track.addEventListener("scroll", () => {
      clearTimeout(tick);
      tick = setTimeout(() => {
        const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        tabs.forEach((t,n) => t.classList.toggle("on", n === i));
      }, 60);
    });
    // open on the source the learner saw last, which is the one they were reading
    d.addEventListener("toggle", () => {
      if(d.open) requestAnimationFrame(() => { track.scrollLeft = (tabs.length-1) * track.clientWidth; });
    });
  });
}
function stripTags(h){ return String(h||"").replace(/<[^>]+>/g,""); }

// ============ SOURCE ============
// Every source rendered so far, in order, so any later question can reopen all
// of them. LAST_SOURCE is kept as the final entry for anything still reading it.
let SOURCES_SEEN = [];
let LAST_SOURCE = null;

function renderSource(item){
  const s=item.source;
  LAST_SOURCE = { label: item.sourceLabel || item.tag || "the source", attr: s.attr, body: s.body };
  if(!SOURCES_SEEN.some(x => x.label === LAST_SOURCE.label)) SOURCES_SEEN.push(LAST_SOURCE);
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.html||""}
      <div class="source">
        <div class="source-attr">${s.attr}</div>
        <div class="source-body">${s.body}</div>
        ${s.toggle?`<button class="toggle-btn" data-toggle>${s.toggleLabel||"What does this actually mean?"}</button><div class="toggle-body">${s.toggle}</div>`:""}
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  bindToggles();
}

// ============ QUESTION (mcq / order / sort) ============
function renderQuestion(item){
  if(item.mode==="order") return renderOrder(item);
  if(item.mode==="sort") return renderSort(item);
  return renderMCQ(item);
}

function renderMCQ(item){
  const answered = state.revealed[state.idx];
  if(!state.order[state.idx]){
    const a=item.options.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    state.order[state.idx]=a;
  }
  const order=state.order[state.idx];
  const chip = item.level ? `<span class="chip ${chipCls(item.level)}">${item.level}</span>` : `<span class="chip chip-instinct">Instinct</span>`;
  let opts="";
  order.forEach((orig,pos)=>{
    let cls="option", mark="";
    if(answered){
      if(orig===item.correct){ cls+=" correct"; mark=`<span class="opt-mark">&#10003;</span>`; }
      else if(orig===state.answers[state.idx]){ cls+=" wrong"; mark=`<span class="opt-mark">&#10007;</span>`; }
      else cls+=" dimmed";
    } else if(state.answers[state.idx]===orig){ cls+=" selected"; }
    opts+=`<button class="${cls}" data-orig="${orig}" ${answered?"disabled":""}><span class="opt-letter">${String.fromCharCode(65+pos)}</span><span class="opt-text">${item.options[orig]}</span>${mark}</button>`;
  });
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta">${chip}${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="options">${opts}</div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation, order)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{
      state.answers[state.idx]=parseInt(b.dataset.orig,10);
      state.revealed[state.idx]=true;
      render();
    }));
  }
  syncNav(true);
}

// order: tap to place into a numbered list, tap placed to remove; Check when all placed
function renderOrder(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={placed:[]});
  const placed = st.placed;                       // array of content indices in chosen order
  const remaining = item.items.map((_,i)=>i).filter(i=>!placed.includes(i));
  let placedHtml = placed.map((ci,pos)=>{
    let cls="inter-item inter-placed";
    if(answered){ cls = "inter-item "+(ci===item.answer[pos]?"ok":"no"); }
    return `<button class="${cls}" data-placed="${ci}" ${answered?"disabled":""}><span class="rank">${pos+1}</span><span>${esc(item.items[ci])}</span></button>`;
  }).join("");
  let poolHtml = remaining.map(ci=>`<button class="inter-item" data-pool="${ci}"><span class="rank">&bull;</span><span>${esc(item.items[ci])}</span></button>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="inter-pool" id="placed">${placedHtml||`<div style="color:var(--fade);font-size:0.9rem;padding:0.4rem 0;">Tap an event below to start putting them in order.</div>`}</div>
        ${remaining.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool" id="pool">${poolHtml}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-pool]").forEach(b=>b.addEventListener("click",()=>{ placed.push(parseInt(b.dataset.pool,10)); renderOrder(item); }));
    stage.querySelectorAll("[data-placed]").forEach(b=>b.addEventListener("click",()=>{ const ci=parseInt(b.dataset.placed,10); st.placed=placed.filter(x=>x!==ci); renderOrder(item); }));
  }
  const allPlaced = placed.length===item.items.length;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=placed.slice();
    state.revealed[state.idx]=true; render();
  });
}

// sort: two columns, tap an item's column button to place, tap placed to remove
function renderSort(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={col:{}});
  const col = st.col;                              // content index -> 0/1
  const unplaced = item.items.map((_,i)=>i).filter(i=>!(i in col));
  const colCards = (which)=>item.items.map((it,ci)=>{
    if(col[ci]!==which) return "";
    let cls="inter-item inter-placed";
    if(answered) cls="inter-item "+(item.answer[ci]===which?"ok":"no");
    return `<button class="${cls}" data-un="${ci}" ${answered?"disabled":""}><span>${esc(it)}</span></button>`;
  }).join("");
  const pool = unplaced.map(ci=>`
    <div class="inter-item" style="flex-direction:column;align-items:stretch;cursor:default;">
      <span>${esc(item.items[ci])}</span>
      <div class="sort-btns">
        <button class="sort-place" data-place="${ci}" data-col="0">${esc(item.cols[0])}</button>
        <button class="sort-place" data-place="${ci}" data-col="1">${esc(item.cols[1])}</button>
      </div>
    </div>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="sort-cols">
          <div class="sort-col"><h4>${esc(item.cols[0])}</h4>${colCards(0)}</div>
          <div class="sort-col"><h4>${esc(item.cols[1])}</h4>${colCards(1)}</div>
        </div>
        ${unplaced.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool">${pool}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{ col[parseInt(b.dataset.place,10)]=parseInt(b.dataset.col,10); renderSort(item); }));
    stage.querySelectorAll("[data-un]").forEach(b=>b.addEventListener("click",()=>{ delete col[parseInt(b.dataset.un,10)]; renderSort(item); }));
  }
  const allPlaced = unplaced.length===0;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=Object.assign({},col);
    state.revealed[state.idx]=true; render();
  });
}

// ============ NAV ============
function syncNav(isQuestion){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.disabled = isQuestion ? !state.revealed[state.idx] : false;
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
}
// interactive items: replace Continue with a Check button until answered
function syncNavInteractive(canCheck, answered, onCheck){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  if(answered){
    nextBtn.style.display="";
    nextBtn.disabled=false;
    nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
    nextBtn.onclick = defaultNext;
  } else {
    nextBtn.style.display="";
    nextBtn.disabled=!canCheck;
    nextBtn.innerHTML="Check &rarr;";
    nextBtn.onclick = ()=>{ onCheck(); };
  }
}

function defaultNext(){
  if(state.idx<FLOW.length-1){ state.idx++; render(); } else showResults();
}

nextBtn.onclick = defaultNext;
backBtn.addEventListener("click",()=>{
  if(state.idx<=0){ state.idx=-1; renderCover(); }
  else { state.idx--; render(); }
});

// ============ RENDER DISPATCH ============
function render(){
  window.scrollTo({top:0,behavior:"instant"});
  if(state.idx===-1){ renderCover(); return; }
  topBar.classList.remove("hidden");
  document.getElementById("step-count").textContent=`Step ${state.idx+1} of ${FLOW.length}`;
  document.getElementById("fill").style.width=((state.idx+1)/FLOW.length*100)+"%";
  const item=FLOW[state.idx];
  nextBtn.onclick = defaultNext;
  switch(item.type){
    case "story": renderStory(item); syncNav(false); break;
    case "carousel": renderCarousel(item); /* nav handled inside */ syncNavCarousel(); break;
    case "stat": renderStat(item); syncNav(false); break;
    case "source": renderSource(item); syncNav(false); break;
    case "question": renderQuestion(item); break;
    default: renderContent(item); syncNav(false);
  }
}
function syncNavCarousel(){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
  // disabled state already set inside renderCarousel
}

function bindToggles(){
  bindPeek();
  stage.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    b.nextElementSibling.classList.toggle("open");
  }));
}

// ============ RESULTS ============
function showResults(){
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  let correct=0;
  assessedIds.forEach(i=>{ if(isRight(i)) correct++; });
  const total=assessedIds.length;
  const pct = total?Math.round(correct/total*100):0;
  let band="", desc="";
  if(pct>=85){ band="Excellent"; desc=RESULTS.bands.excellent; }
  else if(pct>=70){ band="Strong"; desc=RESULTS.bands.strong; }
  else if(pct>=55){ band="Solid"; desc=RESULTS.bands.solid; }
  else if(pct>=40){ band="Patchy"; desc=RESULTS.bands.patchy; }
  else { band="Start again"; desc=RESULTS.bands.start; }
  const rows=spine().map(sp=>{
    const ids=assessedIds.filter(i=>FLOW[i].level===sp);
    if(!ids.length) return "";
    const g=ids.filter(i=>isRight(i)).length;
    const p=Math.round(g/ids.length*100);
    return `<div class="bd-row"><div class="bd-name">${sp}</div><div class="bd-bar"><div class="bd-fill" style="width:${p}%"></div></div><div class="bd-score">${g}/${ids.length}</div></div>`;
  }).join("");
  stage.innerHTML = `
    <div class="results-head">
      <div class="results-eyebrow">${RESULTS.eyebrow||"Lesson report"}</div>
      <h1 class="results-title">${esc(RESULTS.title||"Where you stand")}</h1>
    </div>
    <div class="score-row">
      <div class="score-block"><div class="score-num">${correct}<span class="score-den">/${total}</span></div><div class="score-label">Correct</div></div>
      <div class="score-block"><div class="score-num">${pct}<span class="score-den">%</span></div><div class="score-label">Accuracy</div></div>
      <div class="score-block"><div class="score-word">${band}</div><div class="score-label">Band</div></div>
    </div>
    <div class="grade-desc">${desc}</div>
    <div class="breakdown"><div class="breakdown-label">By skill</div>${rows}</div>
    <div class="results-actions">
      <button class="btn-secondary" id="restart-btn">Restart lesson</button>
      <button class="btn-primary" id="finish-btn">${esc(RESULTS.next||"Continue")} &rarr;</button>
    </div>
    ${RESULTS.footer?`<div style="text-align:center;margin-top:1.1rem;padding-bottom:4.5rem;font-size:0.92rem;color:var(--fade);">${esc(RESULTS.footer)}</div>`:""}`;
  document.getElementById("restart-btn").addEventListener("click",()=>{
    state.idx=-1; state.answers={}; state.revealed={}; state.order={}; state.carRead={}; state.interState={};
    renderCover();
  });
  /* The button at the end of the lesson is the thing that continues. It does
     not point at a control somewhere else on the page. */
  document.getElementById("finish-btn").addEventListener("click",()=>{ KulaLMS.advance(); });
  KulaLMS.completed();
}

function isRight(i){
  const item=FLOW[i]; const ans=state.answers[i];
  if(ans===undefined) return false;
  if(item.mode==="order") return JSON.stringify(ans)===JSON.stringify(item.answer);
  if(item.mode==="sort"){ return item.items.every((_,ci)=>ans[ci]===item.answer[ci]); }
  return ans===item.correct;
}

renderCover();
})();


/* ---- MODE TOGGLE ---------------------------------------------------------
   Injects its own button so there is no stray markup, and lives inside the
   single script block so a first-to-last script extraction still parses.

   What is stored is the mode the learner chose, "light" or "dark". Never a
   class name, and never "native". A source unit is built light and flips with
   body.dark; an essay unit is built dark and flips with body.bright. Storing
   the class name, or storing "native", meant the word saved on one unit did not
   describe anything on the other, so a learner who chose dark and then opened a
   unit built the other way round got whatever that file defaulted to. The
   choice now travels with them across both kinds of unit.

   To port this to an essay unit, set NATIVE to "dark", FLIP to "light" and CLS
   to "bright". Nothing else changes. */
(function(){
  var NATIVE = "light";   // the mode this unit is designed in
  var FLIP   = "dark";    // the mode the toggle offers
  var CLS    = "dark";    // the class that produces FLIP in this unit
  try{ if(localStorage.getItem("kula-mode")===FLIP){ document.body.classList.add(CLS); } }catch(e){}
  var SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
  var MOON='<path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/>';
  var b=document.getElementById("kula-mode-toggle");
  if(!b){
    b=document.createElement("button");
    b.className="mode-toggle"; b.id="kula-mode-toggle"; b.type="button";
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" id="mode-icon"></svg><span id="mode-label"></span>';
    document.body.appendChild(b);
  }
  var lab=document.getElementById("mode-label"), ic=document.getElementById("mode-icon");
  function paint(){
    var flipped = document.body.classList.contains(CLS);
    var showing = flipped ? FLIP : NATIVE;
    var offering = showing==="dark" ? "light" : "dark";
    lab.textContent = offering==="light" ? "Light mode" : "Dark mode";
    ic.innerHTML = offering==="light" ? SUN : MOON;
    b.setAttribute("aria-pressed", showing==="dark" ? "true" : "false");
    b.setAttribute("aria-label", "Switch to " + offering + " mode");
  }
  b.addEventListener("click",function(){
    var flipped=document.body.classList.toggle(CLS);
    try{ localStorage.setItem("kula-mode", flipped ? FLIP : NATIVE); }catch(e){}
    paint();
  });
  paint();

})();
</script>
</body>
